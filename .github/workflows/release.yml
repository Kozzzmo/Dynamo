# Compile Dynamo pour Windows et publie une nouvelle version a chaque changement de src/version.h.
# Les copies de Dynamo installees chez les utilisateurs lisent "latest.txt" et se mettent a jour toutes seules.
name: Compilation et publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer le compilateur Windows (MinGW-w64)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix

      - name: Compiler
        env:
          CXX: x86_64-w64-mingw32-g++-posix
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Preparer la publication
        id: meta
        # latest.txt = version, SHA-256 de Dynamo.exe, puis "sig <Ed25519>" sur "KINETIK-KDYN10 <version> <sha>"
        # (cle de mise a jour Kinetik, secret KINETIK_UPDATE_KEY). Les copies >= 2.7.1 refusent une version non signee :
        # sans le secret, la publication s'arrete ici plutot que de publier une version qu'elles ignoreraient.
        env:
          KINETIK_UPDATE_KEY: ${{ secrets.KINETIK_UPDATE_KEY }}
        run: |
          VERSION=$(sed -n 's/^#define DYN_VERSION_STR *"\(.*\)".*/\1/p' src/version.h)
          SHA=$(sha256sum build/Dynamo.exe | cut -d' ' -f1)
          if [ -z "$KINETIK_UPDATE_KEY" ]; then echo "::error title=KINETIK_UPDATE_KEY manquant::la mise a jour doit etre signee"; exit 1; fi
          pip install --quiet cryptography
          SIG=$(python3 -c "import os,sys; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K; k=K.from_private_bytes(bytes.fromhex(os.environ['KINETIK_UPDATE_KEY'].strip())); print(k.sign(('KINETIK-KDYN10 %s %s\n' % (sys.argv[1], sys.argv[2])).encode()).hex())" "$VERSION" "$SHA")
          printf '%s\n%s\nsig %s\n' "$VERSION" "$SHA" "$SIG" > build/latest.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION — SHA-256 $SHA"

      - name: Garder le .exe de cette compilation
        uses: actions/upload-artifact@v4
        with:
          name: Dynamo-${{ steps.meta.outputs.version }}
          path: build/Dynamo.exe

      - name: Publier sur le depot public de telechargements (adresse des mises a jour)
        # Les copies installees (>= 2.6.0) lisent latest.txt et Dynamo.exe dans la release "kdyn10"
        # du depot public Kozzzmo/kinetik-downloads. Secret requis : DOWNLOADS_TOKEN (jeton GitHub
        # a grain fin, acces au seul depot kinetik-downloads, permission Contents : lecture et ecriture).
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=DOWNLOADS_TOKEN manquant::sans ce secret les mises a jour ne peuvent pas etre publiees"; exit 1
          fi
          R=Kozzzmo/kinetik-downloads; T=kdyn10
          fail() { echo "::error title=kinetik-downloads::$1"; exit 1; }
          gh api "repos/$R" >/dev/null 2>&1 || fail "depot $R inaccessible avec DOWNLOADS_TOKEN (acces au depot ?)"
          # un depot vide ne peut pas porter de release : premier commit (README) si besoin
          if ! gh api "repos/$R/commits?per_page=1" >/dev/null 2>&1; then
            printf '# Kinetik downloads\n\nInstallers and update files of the Kinetik products (see Releases).\n' > /tmp/readme.md
            gh api -X PUT "repos/$R/contents/README.md" -f message="Initial commit" \
              -f content="$(base64 -w0 /tmp/readme.md)" >/dev/null || fail "creation du README impossible (permission Contents : Read and write ?)"
          fi
          cp build/Dynamo.exe build/Kinetik-KDYN10.exe
          NOTES="Kinetik KDYN-10 $VERSION (Windows 10/11, 64 bits). Telecharger Kinetik-KDYN10.exe ; Dynamo.exe et latest.txt servent aux mises a jour automatiques."
          gh release view "$T" -R "$R" >/dev/null 2>&1 || gh release create "$T" -R "$R" --title "Kinetik KDYN-10" --notes "$NOTES" \
            || fail "creation de la release $T impossible"
          # l'exe d'abord, latest.txt ensuite : une copie installee ne voit jamais une version annoncee sans son fichier
          gh release upload "$T" -R "$R" --clobber build/Kinetik-KDYN10.exe build/Dynamo.exe || fail "envoi des exe impossible"
          gh release upload "$T" -R "$R" --clobber build/latest.txt || fail "envoi de latest.txt impossible"
          gh release edit "$T" -R "$R" --title "Kinetik KDYN-10 $VERSION" --notes "$NOTES"

      - name: Publier la version (si elle est nouvelle)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La version $VERSION est deja publiee : rien a faire."
            exit 0
          fi
          NOTES=$(awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          [ -n "$NOTES" ] || NOTES="Kinetik KDYN-10 $VERSION"
          # Dynamo.exe = nom interne lu par la mise a jour automatique des copies installees ;
          # Kinetik-KDYN10.exe = le meme fichier, sous le nom du produit, pour les nouveaux telechargements.
          gh release create "v$VERSION" build/Kinetik-KDYN10.exe build/Dynamo.exe build/latest.txt \
            --title "Kinetik KDYN-10 $VERSION" --notes "$NOTES" --latest

# One-off: after the history rewrite, point the old version tags at the rewritten commits.
# This file is deleted right after it has run.
name: retag (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retag-once.yml']
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git tag -f v2.3.0 fc5e11b3c388aef3bd62349e1053e9631adcedbc
          git tag -f v2.4.0 0085e68eb462648bf16dc0773455f17f4a9bbacc
          git push -f origin v2.3.0 v2.4.0
          git ls-remote --tags origin
